name: Release

# Push a tag like v0.2.0 to build, sign and publish every Linux package. Installed copies
# pick the new release up with `cachewraith-explorer update`.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # publish the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag must match the app version
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} != package.json ${version}"; exit 1; }

      # Same pinned Ubuntu 22.04 builder as `make package`, so CI and local builds match.
      # Packages are signed so installed copies can verify `cachewraith-explorer update`.
      - name: Build and sign .deb, .rpm, AppImage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "Missing TAURI_SIGNING_PRIVATE_KEY secret"; exit 1; }
          make package
          ls dist-packages/*.sig

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-packages
          path: dist-packages/

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          make_latest: true
          files: dist-packages/*

  aur:
    # Publishes the new version to the AUR (cachewraith-explorer-bin) once the release exists.
    needs: packages
    runs-on: ubuntu-24.04
    container: archlinux:base-devel@sha256:70d777aaeb45befc04150df137c4d7c1b5042be442b4c904c38c6f6880bb7844
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-packages
          path: dist-packages

      - name: Tools
        run: pacman -Syu --noconfirm --needed git openssh

      - name: Render PKGBUILD and .SRCINFO
        run: |
          version="${GITHUB_REF_NAME#v}"
          packaging/aur/render.sh "$version" "dist-packages/cachewraith-explorer_${version}_amd64.deb"

      - name: Push to the AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          test -n "$AUR_SSH_PRIVATE_KEY" || { echo "Missing AUR_SSH_PRIVATE_KEY secret"; exit 1; }
          packaging/aur/publish.sh
