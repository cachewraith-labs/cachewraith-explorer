[package]
name = "cachewraith-explorer"
version = "0.1.0"
description = "A Material You file explorer for Hyprland"
authors = ["cachewraith"]
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
name = "cachewraith_explorer_lib"
crate-type = ["rlib"]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-clipboard-manager = "=2.3.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
parking_lot = "0.12"
tokio = { version = "1", features = ["sync"] }
notify = { version = "8.2", default-features = false }
notify-debouncer-full = { version = "0.7", default-features = false }
trash = "5.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "ico", "tiff"] }
rustix = { version = "1", features = ["fs", "process"] }
dirs = "7"
percent-encoding = "2"
ureq = { version = "=3.4.0", features = ["json"] }
minisign-verify = "0.2"
base64 = "0.22"
semver = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
